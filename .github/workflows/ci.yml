name: CI

# Offline selftests of the click's Python/QML and of the release tooling on
# both platforms the maintainers use. Nothing here touches a device, a
# network channel or a signing key: every suite runs against in-process
# fakes and throwaway keys.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain versions
        run: |
          python3 --version
          openssl version || true
          # Ed25519 signing needs OpenSSL ≥ 1.1.1 (macOS /usr/bin ships LibreSSL);
          # scripts/release/openssl-resolve.sh picks Homebrew's when present.
          command -v brew >/dev/null && brew --prefix openssl@3 || true
      - name: Identity invariants
        run: python3 scripts/identity_selftest.py
      - name: Bridge (install pipeline, migrate verb, keep-awake swap)
        run: python3 scripts/bridge_selftest.py
      - name: Release verifier
        run: python3 scripts/release_selftest.py
      - name: Publisher (fake GitHub API, legacy transition)
        run: python3 scripts/publish_selftest.py
      - name: Click packaging
        run: python3 scripts/click_selftest.py
      - name: Chat client + QML sweep
        run: python3 scripts/chat_selftest.py
      # scripts/watch_selftest.py is NOT run on this branch yet: the watcher
      # (release_watch.py / release_heartbeat.py / install_release_watch.sh)
      # is renamed in Stage 6 of the rename plan; until then its DEFAULT_CONFIG
      # still names the previous channels while py/release_verify.py already
      # pins the new ones, so the suite fails by construction. Stage 6
      # restores the step.
      - name: QR decoder (generator cross-check needs the website checkout — skipped here)
        run: |
          # qr_selftest.py cross-checks the JS generator from the website repo,
          # which CI does not have; run it locally with BRIGLIA_QRLIB_JS set.
          python3 -c "import sys; sys.path.insert(0, 'py'); import qr_scan; print('qr_scan imports, prefix', qr_scan.BUNDLE_PREFIX)"
